<svg width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AnisPaper banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="50%" stop-color="#ffec99"/>
      <stop offset="100%" stop-color="#ffd54a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>

  <!-- soft stars -->
  <g fill="#ffd54a" opacity="0.95" filter="url(#soft)">
    <circle cx="120" cy="70" r="4"/>
    <circle cx="175" cy="98" r="2.5"/>
    <circle cx="250" cy="55" r="3"/>
    <circle cx="1280" cy="75" r="4"/>
    <circle cx="1210" cy="105" r="2.5"/>
    <circle cx="1135" cy="62" r="3"/>
  </g>

  <!-- cascade -->
  <g fill="url(#gold)" filter="url(#glow)" opacity="0.95">
    <path d="M190 86l8 18 19 2-14 12 4 19-17-10-17 10 4-19-14-12 19-2 8-18z"/>
    <path d="M220 130l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1 5-11z"/>
    <path d="M245 168l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1 4-9z"/>
    <path d="M268 198l3 7 7 1-5 5 2 7-7-4-7 4 2-7-5-5 7-1 3-7z"/>

    <path d="M1210 86l8 18 19 2-14 12 4 19-17-10-17 10 4-19-14-12 19-2 8-18z"/>
    <path d="M1180 130l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1 5-11z"/>
    <path d="M1155 168l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1 4-9z"/>
    <path d="M1132 198l3 7 7 1-5 5 2 7-7-4-7 4 2-7-5-5 7-1 3-7z"/>
  </g>

  <!-- title -->
  <text x="700" y="125" text-anchor="middle" fill="#f7f7f7" font-family="Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="9">✦   A N I S   S T A R   ✦</text>
  <text x="700" y="205" text-anchor="middle" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="3">AnisPaper</text>
  <text x="700" y="250" text-anchor="middle" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="24" opacity="0.9">Live wallpapers for KDE Plasma, with a separate scene engine that keeps Plasma alive.</text>

  <!-- decorative line -->
  <rect x="400" y="286" width="600" height="4" rx="2" fill="url(#gold)" opacity="0.95"/>

  <!-- badges -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20">
    <rect x="430" y="320" width="128" height="38" rx="19" fill="#181818" stroke="#ffd54a" stroke-width="2"/>
    <text x="494" y="345" text-anchor="middle" fill="#fff4c2">KDE Plasma 6</text>

    <rect x="576" y="320" width="104" height="38" rx="19" fill="#181818" stroke="#ffd54a" stroke-width="2"/>
    <text x="628" y="345" text-anchor="middle" fill="#fff4c2">Wayland</text>

    <rect x="698" y="320" width="140" height="38" rx="19" fill="#181818" stroke="#ffd54a" stroke-width="2"/>
    <text x="768" y="345" text-anchor="middle" fill="#fff4c2">Scene Engine</text>

    <rect x="856" y="320" width="114" height="38" rx="19" fill="#181818" stroke="#ffd54a" stroke-width="2"/>
    <text x="913" y="345" text-anchor="middle" fill="#fff4c2">Multi-monitor</text>
  </g>
</svg>
